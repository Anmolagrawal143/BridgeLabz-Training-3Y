<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 9 - File Upload Form</title>
</head>
<body>
    <h1>File Upload Form</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <p>
            <label for="file_upload">Select Image File:</label><br>
            <input type="file" id="file_upload" name="file_upload" accept=".jpg, .png, image/jpeg, image/png">
        </p>

        <p>Note: Only image files with <strong>.jpg</strong> or <strong>.png</strong> extensions are permitted for upload.</p>

        <p>
            <input type="submit" value="Upload File">
        </p>
    </form>
</body>
</html>
