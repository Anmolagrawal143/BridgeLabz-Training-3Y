<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 7 - Login Form with CSRF Token</title>
</head>
<body>
    <h1>Login Form</h1>
    <form action="#" method="post">
        <!-- 
            CSRF (Cross-Site Request Forgery) Token:
            A CSRF token is a unique, secret, and unpredictable value generated by the server-side application.
            It protects against unauthorized command submissions from untrusted sites by ensuring that the request 
            was intentionally sent by the authenticated user.
        -->
        <input type="hidden" name="csrf_token" value="d9f8e7a6b5c43210123456789abcdef0">

        <p>
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required>
        </p>

        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>
        </p>

        <p>
            <input type="submit" value="Login">
        </p>
    </form>
</body>
</html>
