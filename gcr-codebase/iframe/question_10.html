<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 10 - Contact Form</title>
</head>
<body>
    <h1>Contact Form</h1>
    <form action="#" method="post">
        <p>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </p>

        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </p>

        <p>
            <label for="subject">Subject:</label><br>
            <input type="text" id="subject" name="subject" placeholder="Enter topic subject" required>
        </p>

        <p>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..." required></textarea>
        </p>

        <p>
            <input type="submit" value="Send Message">
        </p>
    </form>
</body>
</html>
