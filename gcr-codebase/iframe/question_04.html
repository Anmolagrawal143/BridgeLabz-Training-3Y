<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 4 - Frameset Layout</title>
</head>
<!-- Frameset tag creates a grid of frames -->
<frameset rows="20%,80%">
    <!-- Top frame loading navigation links -->
    <frame src="question_04_nav.html" name="topFrame">
    <!-- Bottom frame displaying main content -->
    <frame src="question_04_content.html" name="bottomFrame">
    <noframes>
        <body>
            <p>Your browser does not support frames.</p>
        </body>
    </noframes>
</frameset>
</html>
