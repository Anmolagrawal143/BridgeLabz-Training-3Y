<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 16 - URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Example</h1>
    
    <!-- Link with %20 encoding for spaces and %26 for ampersand -->
    <p>
        <a href="https://example.com/search?query=HTML%20%26%20CSS">Search HTML &amp; CSS</a>
    </p>
    
    <p>
        <strong>Original URL:</strong> https://example.com/search?query=HTML &amp; CSS<br>
        <strong>Encoded URL:</strong> https://example.com/search?query=HTML%20%26%20CSS
    </p>
</body>
</html>
