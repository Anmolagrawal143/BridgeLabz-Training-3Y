<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 2 - Google Maps Embed</title>
</head>
<body>
    <h1>Google Map Embed</h1>
    <!-- 
        The loading="lazy" attribute defers loading of the iframe until it comes close to the viewport (as the user scrolls).
        This improves initial page loading speed and saves data/bandwidth for users.
    -->
    <iframe 
        title="Google Map of New Delhi" 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.83923192776!2d77.06889754725782!3d28.52728034389636!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cfd5b347eb62d%3A0x37205b715389640!2sNew%20Delhi%2C%20Delhi!5e0!3m2!1sen!2sin!4v1680000000000!5m2!1sen!2sin" 
        width="600" 
        height="450" 
        loading="lazy">
    </iframe>
</body>
</html>
