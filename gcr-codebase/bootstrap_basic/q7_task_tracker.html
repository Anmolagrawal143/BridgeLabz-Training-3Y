<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - Task Tracker with Badges</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7_task_tracker.css">
</head>
<body class="bg-light py-5">
    <main class="container max-w-700">
        <div class="card shadow-sm border-0">
            <!-- Header with Badge Counter -->
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center p-3">
                <h1 class="h4 mb-0 fw-bold">Task Tracker Dashboard</h1>
                <span class="badge bg-light text-primary fs-6">3 Pending</span>
            </div>

            <!-- List Group with Contextual Badges -->
            <div class="card-body p-4">
                <ul class="list-group mb-4">
                    <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                        <span>Fix authentication bug in login module</span>
                        <span class="badge bg-danger">High Priority</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                        <span>Update database schema documentation</span>
                        <span class="badge bg-warning text-dark">Medium Priority</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                        <span>Refactor CSS grid classes for mobile view</span>
                        <span class="badge bg-info text-dark">Low Priority</span>
                    </li>
                </ul>

                <!-- Button with Embedded Badge -->
                <div class="text-end">
                    <button type="button" class="btn btn-success fw-bold px-4">
                        Completed Tasks <span class="badge bg-white text-success ms-2">12</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
