<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>
    <h1 title="Name of the school">Green Valley School</h1>
    <h2>Student Report Card</h2>
    <p>Student Name: Anmol Agrawal</p>
    <p>Class: 12</p>

    <table border="1">
        <caption>Subject-wise Marks</caption>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Maximum Marks</th>
                <th>Marks Obtained</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>English</td><td>100</td><td>85</td></tr>
            <tr><td>Mathematics</td><td>100</td><td>90</td></tr>
            <tr><td>Physics</td><td>100</td><td>82</td></tr>
            <tr><td>Chemistry</td><td>100</td><td>88</td></tr>
            <tr><td>Computer Science</td><td>100</td><td>95</td></tr>
            <tr>
                <th colspan="2" title="Combined marks of all five subjects">Total</th>
                <td>440 / 500</td>
            </tr>
            <tr>
                <th colspan="2">Percentage</th>
                <td>88%</td>
            </tr>
        </tbody>
    </table>
    <p><small>This is a sample student report.</small></p>
</body>
</html>
