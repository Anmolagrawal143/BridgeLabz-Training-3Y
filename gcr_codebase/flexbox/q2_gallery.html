<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="q2_gallery.css">

<body>

            <p class="price">$29.99</p>

        </article>
        <article class="card">
            <h2>HD Monitor</h2>
            <p class="price">$249.99</p>
        </article>
        <article class="card">
            <h2>USB-C Hub</h2>

        </article>

            <h2>Webcam 4K</h2>

</html>
