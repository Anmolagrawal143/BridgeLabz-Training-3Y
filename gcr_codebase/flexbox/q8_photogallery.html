<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 8 - Photo Gallery with Hover Zoom</title>
    <link rel="stylesheet" href="q8_photogallery.css">
</head>
<body>
    <header class="header">
        <h1>Nature Photo Gallery</h1>
    </header>

    <main class="gallery-container">
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80" alt="Mountains">
            <figcaption>Majestic Mountains</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1511497584788-8767611136f6?auto=format&fit=crop&w=500&q=80" alt="Forest Path">
            <figcaption>Mystic Forest Path</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=500&q=80" alt="Foggy Lake">
            <figcaption>Serene Foggy Lake</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=500&q=80" alt="Autumn Canopy">
            <figcaption>Golden Autumn Canopy</figcaption>
        </figure>
    </main>
</body>
</html>
