<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5 - Pricing Section</title>
    <link rel="stylesheet" href="q5_pricing.css">
</head>
<body>
    <header class="header">
        <h1>Select Your Plan</h1>
    </header>

    <main class="pricing-container">
        <div class="card">
            <h2>Basic</h2>
            <p class="price">$15/mo</p>
            <p>Essential features for personal projects.</p>
        </div>

        <div class="card card-featured">
            <span class="badge">Popular</span>
            <h2>Pro Plan</h2>
            <p class="price">$45/mo</p>
            <p>Advanced capabilities for growing teams and startups.</p>
        </div>

        <div class="card">
            <h2>Enterprise</h2>
            <p class="price">$95/mo</p>
            <p>Dedicated infrastructure and full support.</p>
        </div>
    </main>
</body>
</html>
