<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6 - CSS Photo Gallery</title>
    <link rel="stylesheet" href="q6_gallery.css">
</head>
<body>
    <header class="gallery-header">
        <h1>Photo Gallery</h1>
    </header>

    <main class="gallery-grid">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Mountain Landscape">
            <div class="caption">Majestic Mountains</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1511497584788-8767611136f6?auto=format&fit=crop&w=600&q=80" alt="Forest Path">
            <div class="caption">Mystic Forest</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Foggy Valley">
            <div class="caption">Serene Valley</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=600&q=80" alt="Autumn Trees">
            <div class="caption">Golden Autumn</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=600&q=80" alt="Calm Lake">
            <div class="caption">Reflective Lake</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=600&q=80" alt="Sunset View">
            <div class="caption">Sunset Horizons</div>
        </div>
    </main>
</body>
</html>
