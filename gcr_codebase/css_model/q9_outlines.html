<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="q9_outlines.css">
</head>
<body>
    <div class="form-card">
        <h2>Feedback Form</h2>
        <form action="#" method="post">
            <div class="field-group">
                <label for="username">User Name</label>
                <input type="text" id="username" class="outline-solid" placeholder="Solid outline on focus...">
            </div>

            <div class="field-group">
                <label for="useremail">Email Address</label>
                <input type="email" id="useremail" class="outline-dashed" placeholder="Dashed outline with offset...">
            </div>

            <div class="field-group">
                <label for="comments">Comments</label>
                <textarea id="comments" rows="4" class="outline-double" placeholder="Double outline on focus..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Form</button>
        </form>
    </div>
</body>
</html>
