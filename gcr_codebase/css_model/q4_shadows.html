<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4 - Shadows and Depth Effect</title>
    <link rel="stylesheet" href="q4_shadows.css">
</head>
<body>
    <header class="header">
        <h1 class="text-depth">Team Member Profiles</h1>
    </header>

    <main class="cards-row">
        <!-- Card 1: Soft Light Shadow -->
        <article class="card card-soft">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Sarah Connor" class="avatar">
            <h2>Sarah Connor</h2>
            <p class="role">UI/UX Designer</p>
            <p>Focuses on accessible UI design and design systems.</p>
        </article>

        <!-- Card 2: Medium Elevated Shadow -->
        <article class="card card-medium">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" alt="Michael Scott" class="avatar">
            <h2>Michael Scott</h2>
            <p class="role">Frontend Developer</p>
            <p>Specializes in HTML5, CSS layout systems, and animations.</p>
        </article>

        <!-- Card 3: Deep Sharp Shadow -->
        <article class="card card-deep">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="Emma Watson" class="avatar">
            <h2>Emma Watson</h2>
            <p class="role">Product Lead</p>
            <p>Leads cross-functional tech teams and product strategy.</p>
        </article>
    </main>
</body>
</html>
