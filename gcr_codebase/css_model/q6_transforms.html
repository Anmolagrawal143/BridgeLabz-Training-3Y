<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6 - CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q6_transforms.css">
</head>
<body>
    <header class="header">
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to activate the respective CSS transformation.</p>
    </header>

    <main class="transform-container">
        <!-- Box 1: Rotate -->
        <div class="box-wrapper">
            <div class="tf-box box-rotate">Rotate</div>
            <p class="label">rotate(45deg)</p>
        </div>

        <!-- Box 2: Scale -->
        <div class="box-wrapper">
            <div class="tf-box box-scale">Scale</div>
            <p class="label">scale(1.2)</p>
        </div>

        <!-- Box 3: Translate -->
        <div class="box-wrapper">
            <div class="tf-box box-translate">Translate</div>
            <p class="label">translateY(-15px)</p>
        </div>

        <!-- Box 4: Skew -->
        <div class="box-wrapper">
            <div class="tf-box box-skew">Skew</div>
            <p class="label">skewX(15deg)</p>
        </div>
    </main>
</body>
</html>
