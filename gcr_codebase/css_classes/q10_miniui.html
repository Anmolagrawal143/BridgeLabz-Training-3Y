<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 10 - Mini User Interface Layout</title>
    <link rel="stylesheet" href="q10_miniui.css">
</head>
<body>
    <div class="layout-wrapper">
        <header class="ui-header">
            <div class="brand">Apex Portal</div>
        </header>

        <main class="ui-main">
            <article class="main-card">
                <div class="card-header">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="profile-img">
                    <div>
                        <h2>Account Registration</h2>
                        <p>Fill out the profile details below.</p>
                    </div>
                </div>

                <form class="ui-form" action="#" method="post">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-submit">Save Profile</button>
                        <button type="reset" class="btn btn-cancel">Cancel</button>
                    </div>
                </form>
            </article>
        </main>

        <footer class="ui-footer">
            <p>&copy; 2026 Apex Portal. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
