<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5 - Styled Button Collection</title>
    <link rel="stylesheet" href="q5_buttoncollection.css">
</head>
<body>
    <main class="button-wrapper">
        <h1>Styled Button Collection</h1>

        <div class="button-row">
            <!-- Primary Button -->
            <button class="btn btn-primary">Primary Action</button>

            <!-- Secondary Button -->
            <button class="btn btn-secondary">Secondary Action</button>

            <!-- Outline Button -->
            <button class="btn btn-outline">Outline Action</button>

            <!-- Disabled Button -->
            <button class="btn btn-disabled" disabled>Disabled Action</button>
        </div>
    </main>
</body>
</html>
