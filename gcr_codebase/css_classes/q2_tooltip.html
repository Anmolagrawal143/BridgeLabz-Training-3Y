<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2 - Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2_tooltip.css">
</head>
<body>
    <main class="centered-container">
        <h1>CSS Tooltip Demonstration</h1>
        <p class="subtitle">Hover over the items below to reveal the tooltips.</p>

        <div class="tooltip-wrapper">
            <!-- Tooltip Item 1 -->
            <div class="tooltip-item">
                <span class="trigger">HTML5</span>
                <span class="tooltip-box">Semantic Markup Language</span>
            </div>

            <!-- Tooltip Item 2 -->
            <div class="tooltip-item">
                <span class="trigger">CSS3</span>
                <span class="tooltip-box">Styling & Responsive Design</span>
            </div>

            <!-- Tooltip Item 3 -->
            <div class="tooltip-item">
                <span class="trigger">Flexbox</span>
                <span class="tooltip-box">One-Dimensional Layout System</span>
            </div>
        </div>
    </main>
</body>
</html>
