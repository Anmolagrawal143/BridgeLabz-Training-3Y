<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6 - CSS Animation Demonstration</title>
    <link rel="stylesheet" href="q6_animation.css">
</head>
<body>
    <main class="animation-container">
        <!-- 1. Bouncing Ball -->
        <div class="anim-box">
            <div class="bouncing-ball"></div>
            <p>Bouncing Ball</p>
        </div>

        <!-- 2. Moving Box -->
        <div class="anim-box">
            <div class="moving-box"></div>
            <p>Moving Box</p>
        </div>

        <!-- 3. Color Changing Text -->
        <div class="anim-box">
            <h2 class="color-text">Glow Effect</h2>
            <p>Color Transition</p>
        </div>
    </main>
</body>
</html>
