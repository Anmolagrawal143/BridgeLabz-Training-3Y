<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3 - Image Showcase Layout</title>
    <link rel="stylesheet" href="q3_imageshowcase.css">
</head>
<body>
    <header class="header">
        <h1>Gallery Showcase</h1>
    </header>

    <main class="grid-container">
        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=500&q=80" alt="Landscape">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountain Valley</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1511497584788-8767611136f6?auto=format&fit=crop&w=500&q=80" alt="Forest Path">
                <div class="overlay"></div>
            </div>
            <figcaption>Misty Forest</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=500&q=80" alt="Lake Sunset">
                <div class="overlay"></div>
            </div>
            <figcaption>Serene Lake</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=500&q=80" alt="Autumn Canopy">
                <div class="overlay"></div>
            </div>
            <figcaption>Autumn Colors</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=500&q=80" alt="Desert Dunes">
                <div class="overlay"></div>
            </div>
            <figcaption>Reflective Waters</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=500&q=80" alt="Ocean Horizon">
                <div class="overlay"></div>
            </div>
            <figcaption>Sunset Horizon</figcaption>
        </figure>
    </main>
</body>
</html>
