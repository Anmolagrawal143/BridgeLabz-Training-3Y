<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 7 - User Interface Components</title>
    <link rel="stylesheet" href="q7_uicomponents.css">
</head>
<body>
    <main class="ui-card">
        <h2>Dashboard Search</h2>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search keywords..." class="search-input">
            <button class="search-btn">Search</button>
        </div>

        <!-- Filter Dropdown & Action Buttons -->
        <div class="controls-row">
            <select class="dropdown-menu">
                <option value="all">All Categories</option>
                <option value="articles">Articles</option>
                <option value="users">Users</option>
            </select>
            <button class="action-btn">Filter</button>
        </div>
    </main>
</body>
</html>
