<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - Combined Effects Demonstration</title>
    <link rel="stylesheet" href="q9_combinedeffects.css">
</head>
<body>
    <main class="container">
        <h1>Combined Interactive Effects</h1>

        <div class="card-grid">
            <div class="interactive-card card-1">
                <h3>Scale & Elevate</h3>
                <p>Hover to see scale expansion and elevated shadow effects.</p>
                <button class="effect-btn btn-1">Interact</button>
            </div>

            <div class="interactive-card card-2">
                <h3>Rotate & Highlight</h3>
                <p>Hover to trigger rotation and border highlight animations.</p>
                <button class="effect-btn btn-2">Interact</button>
            </div>

            <div class="interactive-card card-3">
                <h3>Slide & Color Fade</h3>
                <p>Hover to see upward translation and background color transitions.</p>
                <button class="effect-btn btn-3">Interact</button>
            </div>
        </div>
    </main>
</body>
</html>
